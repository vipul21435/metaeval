[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "metaeval"
version = "0.1.0.dev0"
description = "Correlate automatic metric or grader scores with human ratings, with the grouping stated on every number."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vipul Raj Jha" }]
keywords = ["evaluation", "metrics", "correlation", "meta-evaluation", "kendall-tau"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]

[project.scripts]
metaeval = "metaeval.cli:main"

[project.urls]
Homepage = "https://github.com/vipul21435/metaeval"
Issues = "https://github.com/vipul21435/metaeval/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/metaeval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.coverage.run]
source = ["metaeval"]
branch = true

[tool.coverage.report]
show_missing = true
